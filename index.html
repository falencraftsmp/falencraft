<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>FalencraftSMP - Join Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .title img {
      width: 52px;
      height: 52px;
    }

    h1 {
      font-size: 34px;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      max-width: 440px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .info {
      background: #334155;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 15px;
      line-height: 1.6;
    }

    .btn {
      display: block;
      margin-top: 20px;
      padding: 16px;
      background: #22c55e;
      color: black;
      text-decoration: none;
      font-weight: bold;
      border-radius: 12px;
      font-size: 16px;
    }

    .note {
      margin-top: 15px;
      font-size: 13px;
      color: #cbd5f5;
    }
  </style>
</head>

<body>

  <!-- JUDUL + LOGO -->
  <div class="title">
    <img src="logo.png" alt="Falencraft Logo">
    <h1>
      <span style="color:#f59e0b;">Falencraft</span><span style="color:#ffffff;">SMP</span>
    </h1>
  </div>

  <div class="card">
    <p><b>Minecraft Server</b></p>

    <div class="info">
      <b>Java Edition</b><br>
      IP: <b>s1.falencraft.my.id</b><br><br>

      <b>Bedrock Edition</b><br>
      IP: <b>s1.falencraft.my.id</b><br>
      Port: <b>25564</b>
    </div>

    <!-- BEDROCK AUTO ADD -->
    <a class="btn"
       href="minecraft://?addExternalServer=FalencraftSMP|s1.falencraft.my.id:25564">
       ➕ Join Bedrock (Auto Add)
    </a>

    <div class="note">
      ⚠️ Jika tombol tidak berfungsi, buka halaman ini melalui <b>Google Chrome</b>.
    </div>
  </div>

</body>
</html>
