<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FalencraftSMP | Minecraft server</title>

  <!-- Embed font Minecraft hanya untuk judul dan edition -->
  <link href="https://fonts.cdnfonts.com/css/minecrafter" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      font-weight: 200;
      color: white;
      text-align: center;
      background: url('https://i.pinimg.com/736x/98/40/e1/9840e1f27c0e6721353e695ffb1e4a47.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0 20px;
    }

    h1 {
      font-family: 'Minecrafter', sans-serif;
      font-size: 3em;
      font-weight: 400;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 30px;
    }

    h1 .falencraft { color: orange; }
    h1 .smp { color: white; }

    .info {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px 20px;
      border-radius: 15px;
      font-size: 0.85em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
      max-width: 400px;
      text-align: left;
      margin-bottom: 20px;
      font-weight: 200;
      line-height: 2;
    }

    .edition { margin: 10px 0; }

    .edition span.title {
      font-family: 'Minecrafter', sans-serif;
      font-weight: 400; 
      font-size: 1.1em;
      display: block;
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .ip-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(255,255,255,0.1);
      padding: 5px 10px;
      margin: 5px 0;
      border-radius: 8px;
      font-size: 0.95em;
      font-weight: 200;
      line-height: 1.8;
      font-family: Arial, sans-serif;
    }

    .ip-box input {
      background: transparent;
      border: none;
      color: white;
      width: 180px;
      font-size: 0.95em;
      text-align: right;
      cursor: pointer;
      font-weight: 200;
      font-family: Arial, sans-serif;
    }

    .copy-btn {
      cursor: pointer;
      margin-left: 8px;
      font-size: 1em;
    }

    .btn {
      display: inline-block;
      padding: 6px 14px;
      background-color: #00bfff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 200;
      font-size: 0.85em;
      margin-bottom: 20px;
      line-height: 1.8;
      font-family: Arial, sans-serif;
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #009acd;
    }

    .note {
      background-color: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 8px;
      display: inline-block;
      font-family: Arial, sans-serif;
      font-size: 0.65em;
      font-weight: 100;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
      margin-bottom: 15px;
      text-align: center;
      max-width: 500px;
      line-height: 1.8;
    }

    .social a {
      display: inline-block;
      margin: 5px 6px;
      padding: 4px 8px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 200;
      font-size: 0.75em;
      line-height: 1.8;
      font-family: Arial, sans-serif;
      transition: transform 0.2s;
    }

    .social a:hover { transform: scale(1.05); }
    .wa { background-color: #25D366; }
    .dc { background-color: #7289DA; }
    .tt { background: linear-gradient(45deg, #69C9D0, #EE1D52, #F7B600); }

  </style>
</head>

<body>

  <h1>⛏️ <span class="falencraft">Falencraft</span><span class="smp">SMP</span> | Server Minecraft</h1>

  <div class="info">

    <div class="edition">
      <span class="title">📱 Bedrock Edition</span>
      <div class="ip-box">
        <span>Address/IP:</span>
        <div style="display:flex; align-items:center;">
          <input id="bedrock-ip" type="text" value="s1.falencraft.my.id" readonly>
          <span class="copy-btn" onclick="copyText('bedrock-ip')">📋</span>
        </div>
      </div>
      <div class="ip-box">
        <span>Port:</span>
        <div style="display:flex; align-items:center;">
          <input id="bedrock-port" type="text" value="25564" readonly>
          <span class="copy-btn" onclick="copyText('bedrock-port')">📋</span>
        </div>
      </div>
    </div>

    <div class="edition">
      <span class="title">🌐 Java Edition</span>
      <div class="ip-box">
        <span>Address/IP:</span>
        <div style="display:flex; align-items:center;">
          <input id="java-ip" type="text" value="s1.falencraft.my.id" readonly>
          <span class="copy-btn" onclick="copyText('java-ip')">📋</span>
        </div>
      </div>
    </div>

  </div>

  <a class="btn" href="minecraft://?addExternalServer=FalencraftSMP|s1.falencraft.my.id:25564">
    🎮 Join Bedrock (Auto Add)
  </a>

  <!-- Tombol STORE baru -->
  <a class="btn" href="http://store.falencraft.my.id" target="_blank">
    🛒 STORE
  </a>

  <div class="note">
    ⚠️ Jika tombol tidak berfungsi, buka halaman ini melalui <b>Google Chrome</b>. Klik IP/Port untuk menyalin.
  </div>

  <div class="social">
    <a class="wa" href="https://whatsapp.com/channel/0029Vb6OKH03rZZjthStDu0V" target="_blank">📢 WhatsApp Channel</a>
    <a class="dc" href="https://discord.gg/BqCAQx7qgj" target="_blank">💬 Discord Server</a>
    <a class="tt" href="https://tiktok.com/@falencraftsmp" target="_blank">🎵 TikTok</a>
  </div>

  <script>
    function copyText(id) {
      const el = document.getElementById(id);
      el.select();
      el.setSelectionRange(0, 99999);
      document.execCommand("copy");
      alert(el.value + " disalin ke clipboard!");
    }
  </script>

</body>
</html>
