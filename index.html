<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ FalencraftSMP | Minecraft Server</title>

<link href="https://fonts.cdnfonts.com/css/minecrafter" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
    url('https://i.pinimg.com/736x/98/40/e1/9840e1f27c0e6721353e695ffb1e4a47.jpg')
    no-repeat center/cover fixed;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  max-width:480px;
  width:100%;
  text-align:center;
}

h1{
  font-family:'Minecrafter',sans-serif;
  font-size:2.6em;
  margin-bottom:10px;
  text-shadow:0 6px 25px rgba(0,0,0,.9);
}

.brand{ color:#ff9f1c; }
.white{ color:#ffffff; }

/* STATUS DEWA */
#serverStatusTop{
  margin-bottom:18px;
  font-weight:bold;
  animation:pulse 1.5s infinite;
}
#serverStatusTop.online{ color:#00ff6a; }
#serverStatusTop.offline{ color:#ff4d4d; }

@keyframes pulse{
  0%{ text-shadow:0 0 0 rgba(0,255,100,.3);}
  50%{ text-shadow:0 0 12px rgba(0,255,100,.9);}
  100%{ text-shadow:0 0 0 rgba(0,255,100,.3);}
}

.card{
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(6px);
  border-radius:18px;
  padding:18px;
  text-align:left;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
  margin-bottom:18px;
}

.edition-title{
  font-family:'Minecrafter',sans-serif;
  font-size:1.1em;
  margin-bottom:10px;
}

.line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.08);
  padding:8px 10px;
  border-radius:10px;
  margin:6px 0;
  font-size:.9em;
}

.right{
  display:flex;
  align-items:center;
  gap:8px;
}

.line input{
  background:none;
  border:none;
  color:white;
  width:180px;
  text-align:right;
  font-size:.9em;
}

.copy{
  cursor:pointer;
  transition:.2s;
}
.copy:hover{ transform:scale(1.2); }

.btn{
  display:block;
  margin:10px 0;
  padding:10px;
  background:#00bfff;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-size:.9em;
}
.btn:hover{ background:#009acd; }

.btn.store{
  background:#ff9f1c;
}
.btn.store:hover{
  background:#ff7a00;
}

.note{
  background:rgba(0,0,0,.45);
  border-radius:10px;
  padding:8px 10px;
  font-size:.65em;
  line-height:1.6;
  margin-top:10px;
}

.social{
  margin-top:15px;
}

.social a{
  display:inline-block;
  margin:4px;
  padding:6px 10px;
  border-radius:10px;
  font-size:.75em;
  text-decoration:none;
  color:white;
}

.wa{ background:#25D366; }
.dc{ background:#7289DA; }
.tt{ background:linear-gradient(45deg,#69C9D0,#EE1D52,#F7B600); }

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.85);
  padding:8px 14px;
  border-radius:10px;
  font-size:.75em;
  opacity:0;
  transition:.3s;
}
.toast.show{ opacity:1; }
</style>
</head>

<body>

<div class="container">

<h1>
  ⛏️ <span class="brand">FalencraftSMP</span>
  <span class="white"> | Minecraft Server</span>
</h1>

<!-- STATUS PINDAH KE SINI -->
<div id="serverStatusTop">Memuat status server...</div>

<div class="card">

  <div class="edition-title">📱 BEDROCK EDITION</div>

  <div class="line">
    <span>IP / Address:</span>
    <div class="right">
      <input id="bedrock-ip" value="s2.falencraft.my.id" readonly>
      <span class="copy" onclick="copyText('bedrock-ip')">📋</span>
    </div>
  </div>

  <div class="line">
    <span>PORT:</span>
    <div class="right">
      <input id="bedrock-port" value="19294" readonly>
      <span class="copy" onclick="copyText('bedrock-port')">📋</span>
    </div>
  </div>

  <br>

  <div class="edition-title">🌐 JAVA EDITION</div>

  <div class="line">
    <span>IP / Address:</span>
    <div class="right">
      <input id="java-ip" value="s2.falencraft.my.id" readonly>
      <span class="copy" onclick="copyText('java-ip')">📋</span>
    </div>
  </div>

</div>

<a class="btn" href="minecraft://?addExternalServer=FalencraftSMP|s2.falencraft.my.id:19294">
  🎮 ADD SERVER
</a>

<a class="btn store" href="http://store.falencraft.my.id" target="_blank">
  🛒 STORE
</a>

<div class="note">
  Jika tombol tidak berfungsi, buka melalui <b>Google Chrome</b><br>
  atau klik IP atau PORT untuk menyalin
</div>

<div class="social">
  <a class="wa" href="https://whatsapp.com/channel/0029Vb6OKH03rZZjthStDu0V" target="_blank">📢 WhatsApp</a>
  <a class="dc" href="https://discord.gg/BqCAQx7qgj" target="_blank">💬 Discord</a>
  <a class="tt" href="https://tiktok.com/@falencraftsmp" target="_blank">🎵 TikTok</a>
</div>

</div>

<div class="toast" id="toast">Disalin!</div>

<script>
function copyText(id){
  const el = document.getElementById(id);
  el.select();
  document.execCommand("copy");

  const toast = document.getElementById("toast");
  toast.innerText = el.value + " disalin!";
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

/* STATUS SERVER (IP TERPISAH) */
const api = "https://api.mcsrvstat.us/2/game-gnl-jh2.raznar.net:25145";

function updateStatus(){
  fetch(api)
    .then(r=>r.json())
    .then(d=>{
      const s = document.getElementById("serverStatusTop");
      if(d.online){
        s.innerText = `🟢 Online • ${d.players.online} / ${d.players.max} pemain`;
        s.className = "online";
      }else{
        s.innerText = "🔴 Offline";
        s.className = "offline";
      }
    })
    .catch(()=>{
      document.getElementById("serverStatusTop").innerText="⚠️ Status error";
    });
}

updateStatus();
setInterval(updateStatus,10000);
</script>

</body>
</html>
