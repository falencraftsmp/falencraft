<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FalencraftSMP - Join Server</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-align: center;
      background: url('https://i.pinimg.com/736x/98/40/e1/9840e1f27c0e6721353e695ffb1e4a47.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0 20px;
    }

    h1 {
      font-size: 3em;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 30px;
    }

    h1 .falencraft {
      color: orange;
    }

    h1 .smp {
      color: white;
    }

    .info {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px 25px;
      padding-left: 40px;
      border-radius: 15px;
      font-size: 1.1em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
      max-width: 400px;
      text-align: left;
      margin-bottom: 20px;
    }

    .edition {
      margin: 10px 0;
    }

    .edition span.title {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .ip-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(255,255,255,0.1);
      padding: 5px 10px;
      margin: 3px 0;
      border-radius: 8px;
      font-size: 1em;
    }

    .ip-box input {
      background: transparent;
      border: none;
      color: white;
      width: 180px; /* diperlebar */
      font-size: 1em;
      text-align: right;
      cursor: pointer;
    }

    .copy-btn {
      cursor: pointer;
      margin-left: 8px;
      font-size: 1.1em;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #00bfff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
      margin-bottom: 20px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #009acd;
    }

    .note {
      background-color: rgba(0,0,0,0.5);
      padding: 10px 15px;
      padding-left: 40px;
      border-radius: 8px;
      display: inline-block;
      font-size: 0.95em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
      margin-bottom: 15px;
      text-align: left;
      max-width: 500px;
    }

    .social a {
      display: inline-block;
      margin: 5px 10px;
      padding: 8px 14px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: transform 0.2s;
      font-size: 0.95em;
    }

    .social a:hover {
      transform: scale(1.05);
    }

    .wa {
      background-color: #25D366;
    }

    .dc {
      background-color: #7289DA;
    }

    .tt {
      background: linear-gradient(45deg, #69C9D0, #EE1D52, #F7B600);
    }

  </style>
</head>
<body>

  <h1>⛏️ <span class="falencraft">Falencraft</span><span class="smp">SMP</span> | Server Minecraft</h1>

  <div class="info">

    <div class="edition">
      <span class="title">📱 Bedrock Edition</span>
      <div class="ip-box">
        <span>Address/IP:</span>
        <div style="display:flex; align-items:center;">
          <input id="bedrock-ip" type="text" value="s1.falencraft.my.id" readonly>
          <span class="copy-btn" onclick="copyText('bedrock-ip')">📋</span>
        </div>
      </div>
      <div class="ip-box">
        <span>Port:</span>
        <div style="display:flex; align-items:center;">
          <input id="bedrock-port" type="text" value="25564" readonly>
          <span class="copy-btn" onclick="copyText('bedrock-port')">📋</span>
        </div>
      </div>
    </div>

    <div class="edition">
      <span class="title">🌐 Java Edition</span>
      <div class="ip-box">
        <span>Address/IP:</span>
        <div style="display:flex; align-items:center;">
          <input id="java-ip" type="text" value="s1.falencraft.my.id" readonly>
          <span class="copy-btn" onclick="copyText('java-ip')">📋</span>
        </div>
      </div>
    </div>

  </div>

  <a class="btn" href="minecraft://?addExternalServer=FalencraftSMP|s1.falencraft.my.id:25564">
    🎮 Join Bedrock (Auto Add)
  </a>

  <div class="note">
    ⚠️ Jika tombol tidak berfungsi, buka halaman ini melalui <b>Google Chrome</b>. Klik IP/Port untuk menyalin.
  </div>

  <div class="social">
    <a class="wa" href="https://whatsapp.com/channel/0029Vb6OKH03rZZjthStDu0V" target="_blank">📢 WhatsApp Channel</a>
    <a class="dc" href="https://discord.gg/BqCAQx7qgj" target="_blank">💬 Discord Server</a>
    <a class="tt" href="https://tiktok.com/@falencraftsmp" target="_blank">🎵 TikTok</a>
  </div>

  <script>
    function copyText(id) {
      const copyText = document.getElementById(id);
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      document.execCommand("copy");
      alert(copyText.value + " disalin ke clipboard!");
    }
  </script>

</body>
</html>
